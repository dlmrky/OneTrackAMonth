<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twelve / Twelve / Twelve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --bg-row:#0d0d0d;
    --hairline:#212121;
    --text:#ededed;
    --muted:#5c5c5c;
    --muted-2:#3a3a3a;
    --amber:#ffb000;
    --amber-dim:rgba(255,176,0,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;
  }
  body{
    min-height:100vh;
    padding:64px 5vw 140px;
  }

  /* ---------- header ---------- */
  .masthead{
    text-align:center;
    margin-bottom:72px;
  }
  .masthead .eyebrow{
    font-size:11px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .masthead h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(28px,4vw,44px);
    letter-spacing:-0.01em;
    margin-top:10px;
  }
  .masthead .sub{
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.05em;
  }

  /* ---------- grid ---------- */
  .board{
    max-width:980px;
    margin:0 auto;
    display:grid;
    grid-template-columns: 96px repeat(3, 1fr);
  }

  .logo-row, .name-row{
    display:contents;
  }

  .corner{ }

  .col-head{
    padding-bottom:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .mark{
    width:44px;height:44px;
  }
  .mark circle, .mark path, .mark line{
    stroke:var(--text);
    fill:none;
    stroke-width:1.2;
  }

  .artist-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .header-divider{
    grid-column:1 / -1;
    height:1px;
    background:var(--hairline);
    margin-bottom:2px;
  }

  .month-cell{
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
    display:flex;
    align-items:center;
    padding:0 14px;
    border-right:1px solid var(--hairline);
  }

  .track-cell{
    border-right:1px solid var(--hairline);
    display:flex;
    align-items:center;
  }
  .track-cell:last-child{ border-right:none; }

  .row{
    display:contents;
  }
  .row .month-cell, .row .track-cell{
    height:38px;
    border-bottom:1px solid var(--hairline);
  }
  .row:last-child .month-cell,
  .row:last-child .track-cell{
    border-bottom:1px solid var(--hairline);
  }

  .track-btn{
    all:unset;
    cursor:pointer;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--text);
    letter-spacing:0.01em;
    position:relative;
  }
  .track-btn:hover{
    background:rgba(255,255,255,0.03);
  }
  .track-btn:focus-visible{
    outline:1px solid var(--amber);
    outline-offset:-1px;
    background:var(--amber-dim);
  }

  .track-num{
    color:var(--muted-2);
    font-size:11px;
    width:16px;
    flex-shrink:0;
  }

  .eq{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:11px;
    width:12px;
    opacity:0;
    transition:opacity .15s ease;
    flex-shrink:0;
  }
  .track-btn.playing .eq{ opacity:1; }
  .eq span{
    display:block;
    width:2px;
    background:var(--amber);
    animation:eqbar 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1){ animation-delay:0s; }
  .eq span:nth-child(2){ animation-delay:0.2s; }
  .eq span:nth-child(3){ animation-delay:0.4s; }
  @keyframes eqbar{
    0%,100%{ height:3px; }
    50%{ height:11px; }
  }

  .track-btn.playing{
    color:var(--amber);
  }
  .track-btn.playing .track-num{ color:var(--amber); opacity:0.6; }

  /* ---------- now playing bar ---------- */
  .nowplaying{
    position:fixed;
    left:0; right:0; bottom:0;
    background:#000;
    border-top:1px solid var(--hairline);
    padding:16px 5vw;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--muted);
    transform:translateY(100%);
    transition:transform .25s ease;
  }
  .nowplaying.visible{ transform:translateY(0); }
  .nowplaying .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--amber);
    flex-shrink:0;
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.25; }
  }
  .nowplaying .np-text strong{
    color:var(--text);
    font-weight:400;
  }

  footer{
    max-width:980px;
    margin:56px auto 0;
    text-align:center;
    font-size:10.5px;
    color:var(--muted-2);
    letter-spacing:0.05em;
  }

  @media (max-width:640px){
    .board{ grid-template-columns: 64px repeat(3, 1fr); }
    .artist-name{ font-size:11px; }
    .track-btn{ padding:0 8px; font-size:11.5px; gap:6px; }
    .month-cell{ padding:0 6px; font-size:10px; }
    .mark{ width:32px;height:32px; }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="eyebrow">Three artists · Twelve months · Thirty‑six tracks</div>
  <h1>Sam / Rick / Dale</h1>
  <div class="sub">One track each, every month — Jun 2026 through May 2027</div>
</div>

<div class="board" id="board">
  <div class="corner"></div>

  <div class="col-head">
    <svg class="mark" viewBox="0 0 44 44"><circle cx="22" cy="22" r="15"/><line x1="22" y1="7" x2="22" y2="37"/></svg>
    <div class="artist-name">Sam</div>
  </div>
  <div class="col-head">
    <svg class="mark" viewBox="0 0 44 44"><path d="M10 32 L22 8 L34 32 Z"/><line x1="15" y1="24" x2="29" y2="24"/></svg>
    <div class="artist-name">Rick</div>
  </div>
  <div class="col-head">
    <svg class="mark" viewBox="0 0 44 44"><rect x="9" y="9" width="26" height="26"/><line x1="9" y1="22" x2="35" y2="22"/></svg>
    <div class="artist-name">Dale</div>
  </div>

  <div class="header-divider"></div>

  <!-- rows injected by JS -->
</div>

<footer>Click a track title to play</footer>

<div class="nowplaying" id="nowplaying">
  <span class="dot"></span>
  <span class="np-text">Now playing — <strong id="np-label"></strong></span>
</div>

<audio id="player"></audio>

<script>
  const months = [
    ['Jun','2026'],['Jul','2026'],['Aug','2026'],['Sep','2026'],
    ['Oct','2026'],['Nov','2026'],['Dec','2026'],['Jan','2027'],
    ['Feb','2027'],['Mar','2027'],['Apr','2027'],['May','2027']
  ];
  const artists = ['sam','rick','dale'];

  const board = document.getElementById('board');
  const player = document.getElementById('player');
  const nowplaying = document.getElementById('nowplaying');
  const npLabel = document.getElementById('np-label');

  months.forEach((m, i) => {
    const trackNo = i + 1;
    const padded = String(trackNo).padStart(2,'0');

    const row = document.createElement('div');
    row.className = 'row';

    const monthCell = document.createElement('div');
    monthCell.className = 'month-cell';
    monthCell.textContent = `${m[0]}\u2013${m[1].slice(2)}`;
    row.appendChild(monthCell);

    artists.forEach(artist => {
      const cell = document.createElement('div');
      cell.className = 'track-cell';

      const btn = document.createElement('button');
      btn.className = 'track-btn';
      btn.dataset.src = `audio/${artist}/${padded}.mp3`;
      btn.dataset.label = `${artist.charAt(0).toUpperCase()+artist.slice(1)} — Track ${trackNo}`;

      btn.innerHTML = `
        <span class="track-num">${padded}</span>
        <span class="track-title">Track ${trackNo}</span>
        <span class="eq"><span></span><span></span><span></span></span>
      `;

      btn.addEventListener('click', () => playTrack(btn));
      cell.appendChild(btn);
      row.appendChild(cell);
    });

    board.appendChild(row);
  });

  function playTrack(btn){
    document.querySelectorAll('.track-btn.playing').forEach(b => b.classList.remove('playing'));
    btn.classList.add('playing');

    player.src = btn.dataset.src;
    player.play().catch(() => { /* file not present yet at design stage */ });

    npLabel.textContent = btn.dataset.label;
    nowplaying.classList.add('visible');
  }
</script>

</body>
</html>
