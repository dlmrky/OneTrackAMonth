<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twelve / Twelve / Twelve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --bg-row:#0d0d0d;
    --hairline:#212121;
    --text:#ededed;
    --muted:#5c5c5c;
    --muted-2:#3a3a3a;
    --amber:#ffb000;
    --amber-dim:rgba(255,176,0,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;
  }
  body{
    min-height:100vh;
    padding:64px 5vw 140px;
  }

  /* ---------- header ---------- */
  .masthead{
    text-align:center;
    margin-bottom:72px;
  }
  .masthead .eyebrow{
    font-size:11px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .masthead h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(28px,4vw,44px);
    letter-spacing:-0.01em;
    margin-top:10px;
  }
  .masthead .sub{
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.05em;
  }

  /* ---------- grid ---------- */
  .board{
    max-width:980px;
    margin:0 auto;
    display:grid;
    grid-template-columns: 96px repeat(3, 1fr);
  }

  .logo-row, .name-row{
    display:contents;
  }

  .corner{ }

  .col-head{
    padding-bottom:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .mark{
    width:44px;height:44px;
  }
  .mark circle, .mark path, .mark line{
    stroke:var(--text);
    fill:none;
    stroke-width:1.2;
  }

  .artist-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .artist-name.no-caps{
    text-transform:none;
    letter-spacing:0.04em;
  }

  .header-divider{
    grid-column:1 / -1;
    height:1px;
    background:var(--hairline);
    margin-bottom:2px;
  }

  .month-cell{
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
    display:flex;
    align-items:center;
    padding:0 14px;
    border-right:1px solid var(--hairline);
  }

  .track-cell{
    border-right:1px solid var(--hairline);
    display:flex;
    align-items:center;
  }
  .track-cell:last-child{ border-right:none; }

  .row{
    display:contents;
  }
  .row .month-cell, .row .track-cell{
    height:38px;
    border-bottom:1px solid var(--hairline);
  }
  .row:last-child .month-cell,
  .row:last-child .track-cell{
    border-bottom:1px solid var(--hairline);
  }

  .track-btn{
    all:unset;
    cursor:pointer;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--text);
    letter-spacing:0.01em;
    position:relative;
  }
  .track-btn:hover{
    background:rgba(255,255,255,0.03);
  }
  .track-btn:focus-visible{
    outline:1px solid var(--amber);
    outline-offset:-1px;
    background:var(--amber-dim);
  }

  .track-num{
    color:var(--muted-2);
    font-size:11px;
    width:16px;
    flex-shrink:0;
  }

  .eq{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:11px;
    width:12px;
    opacity:0;
    transition:opacity .15s ease;
    flex-shrink:0;
  }
  .track-btn.playing .eq{ opacity:1; }
  .eq span{
    display:block;
    width:2px;
    background:var(--amber);
    animation:eqbar 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1){ animation-delay:0s; }
  .eq span:nth-child(2){ animation-delay:0.2s; }
  .eq span:nth-child(3){ animation-delay:0.4s; }
  @keyframes eqbar{
    0%,100%{ height:3px; }
    50%{ height:11px; }
  }

  .track-btn.playing{
    color:var(--amber);
  }
  .track-btn.playing .track-num{ color:var(--amber); opacity:0.6; }

  /* ---------- player bar ---------- */
  .nowplaying{
    position:fixed;
    left:0; right:0; bottom:0;
    background:#000;
    border-top:1px solid var(--hairline);
    padding:14px 5vw;
    display:flex;
    align-items:center;
    gap:18px;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--muted);
    transform:translateY(100%);
    transition:transform .25s ease;
  }
  .nowplaying.visible{ transform:translateY(0); }

  .pp{
    all:unset;
    cursor:pointer;
    width:34px;height:34px;
    border:1px solid var(--hairline);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:border-color .15s ease;
  }
  .pp:hover{ border-color:var(--muted); }
  .pp:focus-visible{ outline:1px solid var(--amber); outline-offset:2px; }
  .pp svg{ width:12px;height:12px; fill:var(--text); }
  .pp .i-pause{ display:none; }
  .pp.is-playing .i-play{ display:none; }
  .pp.is-playing .i-pause{ display:block; }

  .np-meta{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    flex:0 1 240px;
  }
  .np-meta .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted-2);
    flex-shrink:0;
  }
  .nowplaying.is-playing .np-meta .dot{
    background:var(--amber);
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.25; }
  }
  .np-meta strong{
    color:var(--text);
    font-weight:400;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .time{
    font-size:11px;
    color:var(--muted);
    width:34px;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .time.dur{ text-align:left; }
  .time.cur{ text-align:right; }

  .scrub{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:18px;
    background:transparent;
    cursor:pointer;
    --p:0%;
  }
  .scrub::-webkit-slider-runnable-track{
    height:1px;
    background:linear-gradient(to right,var(--amber) var(--p),var(--muted-2) var(--p));
  }
  .scrub::-moz-range-track{
    height:1px;
    background:var(--muted-2);
  }
  .scrub::-moz-range-progress{
    height:1px;
    background:var(--amber);
  }
  .scrub::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--text);
    margin-top:-4px;
    border:none;
  }
  .scrub::-moz-range-thumb{
    width:9px;height:9px;
    border-radius:50%;
    background:var(--text);
    border:none;
  }
  .scrub:focus-visible{ outline:1px solid var(--amber); outline-offset:4px; }

  .track-btn.playing.paused .eq span{ animation-play-state:paused; }

  footer{
    max-width:980px;
    margin:56px auto 0;
    text-align:center;
    font-size:10.5px;
    color:var(--muted-2);
    letter-spacing:0.05em;
  }

  @media (max-width:640px){
    .board{ grid-template-columns: 64px repeat(3, 1fr); }
    .artist-name{ font-size:11px; }
    .track-btn{ padding:0 8px; font-size:11.5px; gap:6px; }
    .month-cell{ padding:0 6px; font-size:10px; }
    .mark{ width:32px;height:32px; }
    .nowplaying{ flex-wrap:wrap; gap:8px 12px; padding:12px 5vw; }
    .np-meta{ order:-1; flex:1 0 100%; }
    .scrub{ flex:1 1 0; min-width:0; }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="eyebrow">Three artists · Twelve months · Thirty‑six tracks</div>
  <h1>Sam / Rick / Dale</h1>
  <div class="sub">One track each, every month — Jun 2026 through May 2027</div>
</div>

<div class="board" id="board">
  <div class="corner"></div>

  <div class="col-head">
    <svg class="mark" viewBox="0 0 44 44"><circle cx="22" cy="22" r="15"/><line x1="22" y1="7" x2="22" y2="37"/></svg>
    <div class="artist-name">Sam</div>
  </div>
  <div class="col-head">
    <svg class="mark" viewBox="0 0 44 44"><path d="M10 32 L22 8 L34 32 Z"/><line x1="15" y1="24" x2="29" y2="24"/></svg>
    <div class="artist-name">Rick</div>
  </div>
  <div class="col-head">
    <svg class="mark" viewBox="0 0 44 44"><rect x="9" y="9" width="26" height="26"/><line x1="9" y1="22" x2="35" y2="22"/></svg>
    <div class="artist-name no-caps">amDRaM</div>
  </div>

  <div class="header-divider"></div>

  <!-- rows injected by JS -->
</div>

<footer>Click a track title to play</footer>

<div class="nowplaying" id="nowplaying">
  <button class="pp" id="pp" aria-label="Play">
    <svg class="i-play" viewBox="0 0 12 12"><path d="M2 1 L11 6 L2 11 Z"/></svg>
    <svg class="i-pause" viewBox="0 0 12 12"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg>
  </button>
  <div class="np-meta"><span class="dot"></span><strong id="np-label"></strong></div>
  <span class="time cur" id="t-cur">0:00</span>
  <input class="scrub" id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
  <span class="time dur" id="t-dur">0:00</span>
</div>

<audio id="player"></audio>

<script>
  const months = [
    ['Jun','2026'],['Jul','2026'],['Aug','2026'],['Sep','2026'],
    ['Oct','2026'],['Nov','2026'],['Dec','2026'],['Jan','2027'],
    ['Feb','2027'],['Mar','2027'],['Apr','2027'],['May','2027']
  ];
  const artists = ['sam','rick','dale'];

  // Display names used in the "now playing" label
  const displayName = { sam:'Sam', rick:'Rick', dale:'amDRaM' };

  // Custom track titles (text only). Files still play as 01.mp3, 02.mp3, ...
  // Anything not listed here falls back to "Track N".
  const titles = {
    dale: ['Letting Go','YEAH!','ay-eye','la jungle fran\u00e7aise','Pumpkin & Storm']
  };

  const board = document.getElementById('board');
  const player = document.getElementById('player');
  const nowplaying = document.getElementById('nowplaying');
  const npLabel = document.getElementById('np-label');
  const pp = document.getElementById('pp');
  const scrub = document.getElementById('scrub');
  const tCur = document.getElementById('t-cur');
  const tDur = document.getElementById('t-dur');

  let currentBtn = null;

  months.forEach((m, i) => {
    const trackNo = i + 1;
    const padded = String(trackNo).padStart(2,'0');

    const row = document.createElement('div');
    row.className = 'row';

    const monthCell = document.createElement('div');
    monthCell.className = 'month-cell';
    monthCell.textContent = `${m[0]}\u2013${m[1].slice(2)}`;
    row.appendChild(monthCell);

    artists.forEach(artist => {
      const title = (titles[artist] && titles[artist][i]) || `Track ${trackNo}`;

      const cell = document.createElement('div');
      cell.className = 'track-cell';

      const btn = document.createElement('button');
      btn.className = 'track-btn';
      btn.dataset.srcs = JSON.stringify([
        `audio/${artist}/${padded}.mp3`,
        `audio/${displayName[artist]}/${padded}.mp3`,
        `audio/${artist}/${trackNo}.mp3`,
        `audio/${padded}.mp3`,
        `${padded}.mp3`,
        `audio/${artist}/${padded}.MP3`
      ]);
      btn.dataset.label = `${displayName[artist]} \u2014 ${title}`;

      const num = document.createElement('span');
      num.className = 'track-num';
      num.textContent = padded;

      const name = document.createElement('span');
      name.className = 'track-title';
      name.textContent = title;

      const eq = document.createElement('span');
      eq.className = 'eq';
      eq.innerHTML = '<span></span><span></span><span></span>';

      btn.append(num, name, eq);
      btn.addEventListener('click', () => onTrackClick(btn));
      cell.appendChild(btn);
      row.appendChild(cell);
    });

    board.appendChild(row);
  });

  function onTrackClick(btn){
    // Clicking the track that's already loaded toggles play/pause
    if (btn === currentBtn) { togglePlay(); return; }

    document.querySelectorAll('.track-btn.playing').forEach(b => b.classList.remove('playing','paused'));
    btn.classList.add('playing');
    currentBtn = btn;

    attempt = 0;
    loadCurrent();

    npLabel.textContent = btn.dataset.label;
    nowplaying.classList.add('visible');
    resetScrub();
  }


  let attempt = 0;

  function loadCurrent(){
    const srcs = JSON.parse(currentBtn.dataset.srcs);
    player.src = srcs[attempt];
    player.play().catch(() => { /* handled by the error event */ });
  }

  function togglePlay(){
    if (!currentBtn) return;
    if (player.paused) player.play().catch(() => {});
    else player.pause();
  }

  function fmt(s){
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s / 60);
    const r = Math.floor(s % 60);
    return `${m}:${String(r).padStart(2,'0')}`;
  }

  function setFill(){
    const pct = (scrub.value / scrub.max) * 100;
    scrub.style.setProperty('--p', pct + '%');
  }

  function resetScrub(){
    scrub.value = 0;
    setFill();
    tCur.textContent = '0:00';
    tDur.textContent = '0:00';
  }

  function setPlayingState(isPlaying){
    pp.classList.toggle('is-playing', isPlaying);
    pp.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
    nowplaying.classList.toggle('is-playing', isPlaying);
    if (currentBtn) currentBtn.classList.toggle('paused', !isPlaying);
  }

  pp.addEventListener('click', togglePlay);

  player.addEventListener('play',  () => setPlayingState(true));
  player.addEventListener('pause', () => setPlayingState(false));
  player.addEventListener('ended', () => setPlayingState(false));
  player.addEventListener('error', () => {
    setPlayingState(false);
    if (!currentBtn) return;
    const srcs = JSON.parse(currentBtn.dataset.srcs);
    if (attempt < srcs.length - 1) {
      attempt++;
      loadCurrent();
    } else {
      npLabel.textContent = `File not found: ${srcs[0]}`;
    }
  });

  player.addEventListener('loadedmetadata', () => {
    tDur.textContent = fmt(player.duration);
    if (currentBtn) npLabel.textContent = currentBtn.dataset.label;
  });

  player.addEventListener('timeupdate', () => {
    if (dragging || !isFinite(player.duration)) return;
    scrub.value = (player.currentTime / player.duration) * scrub.max;
    setFill();
    tCur.textContent = fmt(player.currentTime);
  });

  let dragging = false;
  scrub.addEventListener('pointerdown', () => { dragging = true; });
  scrub.addEventListener('pointerup',   () => { dragging = false; });
  scrub.addEventListener('input', () => {
    setFill();
    if (!isFinite(player.duration)) return;
    const t = (scrub.value / scrub.max) * player.duration;
    tCur.textContent = fmt(t);
    player.currentTime = t;
  });

  // Space bar toggles play/pause (unless a button/slider is focused)
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !['BUTTON','INPUT'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      togglePlay();
    }
  });
</script>

</body>
</html>
